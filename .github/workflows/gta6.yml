name: Clips GTA 6 (1 par heure, FR + US)

on:
  schedule:
    - cron: "*/10 * * * *"       # GitHub saute souvent ces passages : le Mac déclenche aussi le robot toutes les 15 min
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : monte le clip sans le publier"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gta6
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        compte: [fr, us]
    steps:
      - uses: actions/checkout@v4
      - name: Garde (1 post par heure)
        id: garde
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt, pathlib
          p = pathlib.Path("etat-${{ matrix.compte }}.json")
          posts = json.loads(p.read_text()).get("posts", []) if p.exists() else []
          ok = "${{ inputs.essai }}" == "true" or not posts or \
               dt.datetime.utcnow() - dt.datetime.fromisoformat(posts[-1]["quand"]) >= dt.timedelta(minutes=50)
          print("go=" + ("true" if ok else "false"))
          PY
          cat "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.garde.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        if: steps.garde.outputs.go == 'true'
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Outils
        if: steps.garde.outputs.go == 'true'
        run: |
          if ! (sudo apt-get update -qq && sudo apt-get install -y -qq -o Acquire::Retries=5 ffmpeg); then
            curl -sSL --retry 5 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ
            sudo cp ffmpeg-*-static/ffmpeg ffmpeg-*-static/ffprobe /usr/local/bin/
          fi
          pip install -q -r requirements.txt
      - name: Choisir, monter et publier le clip
        if: steps.garde.outputs.go == 'true'
        env:
          UPLOAD_POST_KEY: ${{ secrets.UPLOAD_POST_KEY }}
        run: python src/gta6.py ${{ matrix.compte }} ${{ inputs.essai == true && '--essai' || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.essai == true }}
        with:
          name: essai-${{ matrix.compte }}
          path: essai/
      - name: Mémoriser les clips déjà faits
        if: ${{ inputs.essai != true && steps.garde.outputs.go == 'true' }}
        run: |
          git config user.name "clips-bot" && git config user.email "bot@users.noreply.github.com"
          git add etat-${{ matrix.compte }}.json && git commit -qm "Clip ${{ matrix.compte }} $(date -u +%FT%H:%M)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 10 + 3)); done
